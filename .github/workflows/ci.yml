name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build release and .deb
        run: |
          cargo install cargo-deb --locked
          cargo build --release
          cargo deb -p datasabi-collector --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: datasabi-collector-deb
          path: target/debian/*.deb

  # The Windows collector (TODO D1) is built up PR by PR; this job keeps the shared
  # engine and everything added for Windows compiling, linted and tested there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Tests that need administrator rights and the internet (a real ETW session);
      # GitHub's Windows runners have both.
      - run: cargo test -- --ignored
      - run: cargo build --release

  # The minimum Rust the crates declare (`rust-version` in Cargo.toml, the highest any
  # locked dependency needs): build and test with exactly that version, since the jobs
  # above use the newest. Read from Cargo.toml, so there's one place to change it.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      # RUSTUP_TOOLCHAIN makes it the job's default Rust, so plain `cargo` uses it and
      # rust-cache files its cache under this version (not the runner's newest).
      - name: Install the minimum Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
