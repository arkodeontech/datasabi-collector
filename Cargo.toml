[workspace]
resolver = "2"
members = ["crates/protocol", "crates/collector"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
authors = ["Arkodeon Technologies Ltd <isaac@arkodeon.com>"]
repository = "https://github.com/arkodeontech/datasabi-collector"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
